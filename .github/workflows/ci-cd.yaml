name: CI/CD workflow

on:
  push:
  pull_request:

permissions:
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - run: hugo --minify

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/vncsmyrnk/blog
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/build-push-action@v5
        if: ${{ !contains(github.event.head_commit.message, '[skip-push]') }}
        id: build
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cd-cloudrun:
    if: ${{ (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-cd]')) }}
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: prod
      url: https://blog.vncsmyrnk.dev
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: ${{ vars.REGION }}
          image: ghcr.io/vncsmyrnk/blog@${{ needs.ci.outputs.digest }}

  cd-cache-prod:
    runs-on: ubuntu-latest
    needs: cd-cloudrun
    environment:
      name: prod
      url: https://blog.vncsmyrnk.dev
    steps:
      - name: Purges cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          curl -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H 'content-type: application/json' \
            -H "Authorization: bearer $CLOUDFLARE_API_KEY" \
            -d '{"hosts": ["blog.vncsmyrnk.dev"]}' \
            --fail
